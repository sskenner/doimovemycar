name: Build and deploy

on:
  schedule:
    - cron: "7 * * * *"   # hourly: 311 can announce snow/emergency suspensions late in the day
  workflow_dispatch:
    inputs:
      intro_post:
        description: "Post the one-time Bluesky welcome post (tests posting)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Date in New York
        id: day
        run: echo "date=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
      # street-cleaning signs change slowly: fetch them once a day, reuse them for the hourly status builds
      - uses: actions/cache@v4
        with:
          path: |
            data/signs.json
            data/dsny_areas.json
          key: signs-v2-${{ steps.day.outputs.date }}
      - name: Build site
        env:
          NYC_API_KEY: ${{ secrets.NYC_API_KEY }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python build.py --keep-signs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: calendar
          path: data/calendar.json
          retention-days: 3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Bluesky alerts (suspension tomorrow / back tomorrow / surprise suspension today). Runs after deploy so the
  # site already shows the new status; post_bsky.py picks the hour window and never posts the same alert twice.
  post:
    needs: deploy
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: calendar
          path: data
      - name: Post to Bluesky
        env:
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: python post_bsky.py ${{ inputs.intro_post && '--intro' || '' }}

  # GitHub turns off scheduled workflows in public repos after 60 days without commits. Re-enabling the
  # workflow from a scheduled run resets that clock, so the site keeps rebuilding while nobody touches the repo.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep the schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(date -u +%H)" = "12" ] || { echo "Only once a day (12 UTC)"; exit 0; }
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/build.yml/enable"
